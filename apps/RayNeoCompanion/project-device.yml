name: RayNeoCompanion
options:
  bundleIdPrefix: io.turboio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ZIPFoundation:
    path: ../../third-party/ZIPFoundation
  RayNeoProtocol:
    path: ../../rayneo-protocol
  RayNeoDisplay:
    path: ../../rayneo-display
  RayNeoSession:
    path: ../../rayneo-session
  RayNeoArchive:
    path: ../../rayneo-archive
  RayNeoAudioContainer:
    path: ../../rayneo-audio-container
targets:
  RayNeoCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../../core-probe/Sources/VoiceToolCallAccumulator.swift
      - ../../core-probe/Sources/CloudASRHostSettings.swift
    dependencies:
      - package: ZIPFoundation
      - package: RayNeoProtocol
      - package: RayNeoDisplay
      - package: RayNeoSession
      - package: RayNeoArchive
      - package: RayNeoAudioContainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.turboio.companion
        PRODUCT_NAME: RayNeoCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Turbo IO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
    info:
      path: Generated/Companion-Info.plist
      properties:
        NSRemindersUsageDescription: 선택한 미리 알림을 Turbo IO 할 일로 복사합니다. 시스템 미리 알림을 수정하거나 삭제하지 않습니다.
        NSRemindersFullAccessUsageDescription: 선택한 미리 알림을 Turbo IO로 복사합니다. 전체 접근 권한으로 표시되지만 읽기만 수행합니다.
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB and Text Books
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container, public.plain-text]
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: 지정한 PC의 Codex 브리지에 연결하여 작업을 보내고 결과를 받습니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RayNeoCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RayNeoCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.turboio.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RayNeoCompanion
  RayNeoCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RayNeoCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.turboio.companion.tests
        GENERATE_INFOPLIST_FILE: YES
  RayNeoCompanionDevice:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../../core-probe/Sources
      - path: ../../core-probe/Vendor/py-webrtcvad-2.0.10/cbits/webrtc/common_audio
        includes: ["**/*.c"]
      - path: ../../core-probe/Vendor/py-webrtcvad-2.0.10/LICENSE
        buildPhase: resources
      - path: ../../core-probe/Vendor/opus-1.5.2/COPYING
        buildPhase: resources
    dependencies:
      - package: RayNeoSession
      - package: RayNeoArchive
      - package: RayNeoAudioContainer
      - package: ZIPFoundation
      - package: RayNeoProtocol
      - package: RayNeoDisplay
      - framework: ../../core-probe/Frameworks/RayneoNet.framework
        embed: true
      - framework: ../../core-probe/Frameworks/CocoaAsyncSocket.framework
        embed: true
      - framework: ../../core-probe/Frameworks/OpenSSL.framework
        embed: true
      - framework: ../../core-probe/Frameworks/RayneoLog.framework
        embed: true
      - framework: ../../core-probe/Frameworks/SwiftProtobuf.framework
        embed: true
      - framework: ../../core-probe/Frameworks/CocoaLumberjack.framework
        embed: true
      - framework: ../../core-probe/Frameworks/SSZipArchive.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.turboio.companion
        PRODUCT_NAME: RayNeoCompanion
        PRODUCT_MODULE_NAME: RayNeoCompanion
        SUPPORTED_PLATFORMS: iphoneos
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COMPANION_DEVICE"
        SWIFT_OBJC_BRIDGING_HEADER: ../../core-probe/Sources/ProbeBridge.h
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../../core-probe/RecoveredInterface/build"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../core-probe/Vendor/opus-1.5.2/include $(SRCROOT)/../../core-probe/Vendor/py-webrtcvad-2.0.10/cbits"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) WEBRTC_POSIX=1"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/../../core-probe/Vendor/opus-ios/libopus.a"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
    info:
      path: Generated/CompanionDevice-Info.plist
      properties:
        CFBundleDisplayName: Turbo IO
        CFBundleVersion: "10"
        CFBundleShortVersionString: "0.2.0"
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        NSLocalNetworkUsageDescription: 지정한 PC의 Codex 브리지에 연결하여 작업을 보내고 결과를 받습니다.
        NSRemindersUsageDescription: 선택한 미리 알림을 Turbo IO 할 일로 복사합니다. 시스템 미리 알림을 수정하거나 삭제하지 않습니다.
        NSRemindersFullAccessUsageDescription: 선택한 미리 알림을 Turbo IO로 복사합니다. 전체 접근 권한으로 표시되지만 읽기만 수행합니다.
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 본인의 안경에 연결하여 음성 호출과 오디오를 받고 응답을 표시합니다.
        NSBluetoothPeripheralUsageDescription: 본인의 RayNeo 안경에 연결합니다.
        UISupportedExternalAccessoryProtocols: [com.rayneo.venus.dev, com.rayneo.venus.pub, cn.rayneo.mercury]
        UIBackgroundModes: [bluetooth-central, external-accessory]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB and Text Books
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container, public.plain-text]
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  RayNeoCompanionDevice:
    build:
      targets:
        RayNeoCompanionDevice: all
    run:
      config: Debug
  RayNeoCompanion:
    build:
      targets:
        RayNeoCompanion: all
    run:
      config: Debug
    test:
      targets: [RayNeoCompanionTests, RayNeoCompanionUITests]
